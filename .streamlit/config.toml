# Local labeling app settings. No telemetry.
[browser]
gatherUsageStats = false

# JobPulse app (app/streamlit_app.py)
[client]
toolbarMode = "viewer"      # no developer toolbar or Deploy button for viewers

[server]
maxUploadSize = 2           # MB; matches config/resume.yaml upload.max_bytes
folderWatchList = ["src"]   # also watch the jobpulse package so a code-only push reloads it

[theme]
primaryColor = "#2F6DB5"    # blue: filters, tabs and progress bars must not read as errors
linkColor = "#2F6DB5"
baseRadius = "0.6rem"
