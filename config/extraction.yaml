# LLM extraction settings (P3). Validated by jobpulse.config.ExtractionConfig.
# Provider: OpenAI. The key is read from the environment variable named below; it never
# appears in this repo. Prices are USD per 1M tokens, copied from the OpenAI pricing page
# (developers.openai.com/api/docs/pricing, checked 2026-11-09). Re-check before changing models.
provider: openai
api_key_env_var: OPENAI_API_KEY
base_url: https://api.openai.com/v1
request_timeout_s: 120
max_workers: 4                # concurrent synchronous calls
extract_schema: extract       # warehouse schema for extractions/quarantine/queue/llm_calls/batches
schema_version: 1             # bump when the Extraction model changes meaning
max_description_chars: 20000  # longer descriptions are cut before the call (bounds cost)

first_pass:                   # cheap model, runs on every posting
  id: gpt-6-luna
  reasoning_effort: low
  input_usd_per_mtok: 0.10
  cached_input_usd_per_mtok: 0.01
  output_usd_per_mtok: 0.50

escalation:                   # runs once, only when the first pass fails validation
  id: gpt-6.1-terra
  reasoning_effort: low
  input_usd_per_mtok: 1.00
  cached_input_usd_per_mtok: 0.05
  output_usd_per_mtok: 5.00

batch:
  discount: 0.5               # Batch API price multiplier (50% off Standard)
  completion_window: 24h

budget:
  run_cap_usd: 0.25           # default per-run spend cap (daily incremental)
  backfill_cap_usd: 1.50      # cap used with --backfill and for batch submission

cost_model:                   # used by the pre-call estimate, the cap check and --dry-run
  chars_per_token: 4.0
  prompt_overhead_tokens: 250 # calibrated 2026-11-10 on 20 postings: avg input 1865 tokens
  expected_output_tokens: 300 # calibrated: avg 271 (min 133, max 454) incl. reasoning at effort=low
  max_output_tokens: 2000     # hard limit sent to the API; also the worst case for the cap check
  cap_safety_factor: 1.25     # multiplies the worst-case estimate in the cap check (tokenizer error)
  escalation_rate: 0.12       # share of postings expected to escalate (projection only)

# Role-family title filter. A posting is a candidate when its title matches one family
# (first match wins; the family name is only used for stratified sampling) and does not
# match `exclude`. Regexes are case-insensitive and run in DuckDB (RE2 syntax).
title_filter:
  exclude: '\b(sales|account executive|account manager|recruit\w*|talent|marketing|customer success|solutions? (engineer|architect)|counsel|paralegal|attorney)\b'
  families:
    - {name: analytics_engineer, pattern: 'analytics engineer'}
    - {name: data_scientist, pattern: 'data scien|decision scien|statistician|quantitative (analyst|researcher)'}
    - {name: data_engineer, pattern: 'data engineer|data platform|data infrastructure|data architect|dataops|data ops|\betl\b|data pipeline'}
    # ML/AI, narrowed 2026-11-10. Rule 1: explicit ML terms (kept even for "ML Software Engineer").
    # Rule 2: "AI" counts only next to data/analytics/research, and generic engineering titles
    # that merely mention AI are dropped. Rule-level exclude, so other families are unaffected.
    - {name: ml_ai_engineer, pattern: 'machine learning|\bML\b|\bMLOps\b|applied scientist'}
    - name: ml_ai_engineer
      pattern: '\bAI\b.*\b(data|analytics|research)\b|\b(data|analytics|research)\b.*\bAI\b'
      exclude: '\b(software|backend|back-end|frontend|front-end|full[- ]?stack|infrastructure|platform|product|program|designer|sales|solutions?)\b'
    - {name: bi, pattern: 'business intelligence|\bBI\b|insights? analyst|reporting analyst'}
    - {name: business_analyst, pattern: 'business analyst|business systems analyst|business operations analyst'}
    - {name: data_analyst, pattern: 'data analyst|analytics|product analyst|data governance|data quality'}

sample:
  size: 200
  seed: 20261109

# Deterministic fill for a missing salary_period (owner decision 2026-11-11). The model sometimes
# returns an amount and no period; validation accepts that. When an amount exists and the period is
# empty, the period is inferred from the amount (salary_min, else salary_max): year when it is at or
# above year_min, hour when it is below hour_max, otherwise left empty. Applied when an extraction
# is stored and, once, to rows already stored; no API call. Inferred values are flagged in
# extract.extractions.salary_period_inferred and never presented as model output.
salary_period_inference:
  year_min: 20000
  hour_max: 500

# Evaluation settings (eval/ scripts). None of this affects extraction or the cache key.
eval:
  # Scoring-time mapping for seniority (owner decision 2026-11-11, from the 38-row pilot: Staff,
  # Principal, Manager, Director and Executive titles were labeled `senior`). The raw exact-match
  # number is always reported next to the mapped one; stored extractions are never changed.
  seniority_fold:
    staff: senior
    principal: senior
    manager: senior
    director: senior
    executive: senior
  # Labeled skills matching this pattern are competencies/concepts, not tools or technologies. The
  # prompt asks for tools only, so they are reported as out of scope (heuristic, case-insensitive).
  skills_out_of_scope_pattern: 'collaborat|communicat|leadership|stakeholder|mentor|management|problem[- ]solving|critical thinking|code review|team ?work|ownership|strategic|presentation|decision[- ]making|prioriti|agile|scrum|project management|business acumen|curiosity|self-starter|detail[- ]oriented'
  agreement:
    size: 100          # postings sampled for the cross-model agreement run
    seed: 20261111
    cap_usd: 0.40      # hard spend cap for that run
    workers: 1         # one call at a time, so the worst-case reservation per call stays small
  salary_tolerance: 0.005    # relative tolerance when comparing parsed and extracted amounts

# Second, targeted sample used ONLY in the sponsorship report. Selection is by posting text alone
# (never by model output). Postings already in the main sample are excluded so nothing is labeled
# twice. If fewer than `size` candidates match, all remaining matches are taken.
sponsorship_sample:
  size: 60
  seed: 20261110
  pattern: 'sponsor|visa|work authori[sz]ation|h-?1b'
