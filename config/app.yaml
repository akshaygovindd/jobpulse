# Public app settings (pages, Home cards, map, KPI deltas). Validated by jobpulse.config.AppConfig.

kpi:
  delta_days: 7                 # "vs last week": compare with the snapshot this many days earlier
                                # (shown only when the data goes back that far)

map:
  coords_file: city_coords.yaml # approximate city-centre coordinates, keyed by the gold city label
  initial_lat: 30.0
  initial_lon: -20.0
  initial_zoom: 1.3
  min_radius_px: 4
  max_radius_px: 36
  # CARTO basemap attribution, shown under the map (required by the basemap's terms).
  attribution: "Map © OpenStreetMap contributors © CARTO"

home:
  top_skills: 3                 # skills named in the Home skill card

samples:
  min_group_n: 10              # groups with fewer postings are not used for headlines or the role picker

trends:
  min_full_weeks: 3             # "Skills over time" is hidden until this many full Mon-Sun weeks exist

pay:
  intern_max_range_ratio: 2.0   # an intern's yearly range wider than 2x is a full-time pay table
