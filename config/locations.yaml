# Bare city names that are unambiguous enough to fill in a missing state or country. Applied only when
# the location gives no state, and its country (if any) matches. Cities NOT listed here stay
# unresolved: they never merge with a qualified one. Dublin is listed as Ireland by owner decision;
# "Dublin, CA" and "US-CA-Dublin" carry an explicit state, so they stay Dublin, California.
