# Rules for deriving `city` from location_raw (src/jobpulse/location.py). Validated by
# jobpulse.config.LocationsConfig. The source data has no structured location, so city is a
# heuristic: it is NULL for remote-only, multi-location, country/state-only or unrecognized strings.
# Known limitation: same-named cities in different countries (Dublin, CA vs Dublin, Ireland) merge.

remote_pattern: '(?i)\b(remote|anywhere|n/a)\b'
multi_pattern: '(?i)(;|•|\||/|\bor\b|\band\b| - | – )'
noise_pattern: '(?i)(\(\s*hq\s*\)|\bhq\b|\boffice\b|\bheadquarters\b)'

# Region names that are also cities: allowed as the first part ("New York, NY", "Washington, DC").
also_cities:
  - new york
  - washington
  - singapore

# Lower-case. A location whose first part is one of these has no city; parts after the first must
# be one of these, or the string is treated as a list of places and city is NULL.
