# Resume Match (app page "Resume match"). Validated by jobpulse.config.ResumeConfig.
# The resume is processed in memory only: these settings bound what is accepted and how skills
# are found. No LLM is involved; skills are looked up deterministically in gold.dim_skill.

upload:
  max_bytes: 2000000          # 2 MB; larger files are rejected before any parsing
  max_pdf_pages: 10
  max_pdf_decoded_bytes: 2000000   # cap on any decompressed PDF stream (a small file can expand hugely)
  max_text_chars: 60000       # extracted or pasted text beyond this is rejected, not truncated
  allowed_extensions: [pdf, txt, md]

parse:
  max_ngram: 4                # longest skill phrase looked up, in words (e.g. "natural language processing")
  # Canonical skill names that are ordinary words or single letters. They count only when written
  # with exactly this casing as a single token ("R", "C", "Go"), never from lower-case prose.
  case_sensitive_skills:
    r: R
    c: C
    go: Go
    ray: Ray
    hex: Hex
    cursor: Cursor
    sigma: Sigma
  # Canonical names too generic to count as a skill claim when found in running text.
  ignore_skills:
    - map
    - log
    - fix
    - zip
    - sam
    - ads
    - ham
    - pos
    - soc
    - search
    - testing
    - ranking
    - monitoring
    - optimization
    - evaluation
    - automation
    - reporting
    - deployment
    - streaming
    - retrieval
    - regression
    - alerting
    - guardrail
    - observability
    - personalization
    # Reviewed with the QA audit (docs/QA_REPORT.md P1-4): words that came from ordinary resume prose
    # ("CTEs", "ran a demo", "Languages: English", "STAR method", "joins") or are too generic to be a
    # skill claim. Edit this list when a new false positive shows up.
    - cte
    - demo
    - english
    - join
    - language
    - star
    - user story
    - problem solving
    - visualization
    - analytic
    - analytics
    - business analytic
    - agent
    - dag
    - delta
    - ci
    - risk
    - research
    - training
    - vision
    - modeling
  # A skill must appear in at least this many open, analyzed postings to be recognized in a resume,
  # so one-off phrases (1,530 of 2,517 skills appear in a single posting) are not offered as skills.
  min_posting_frequency: 3
  title_keywords: [analyst, engineer, scientist, developer, researcher, architect, manager, intern]
  # Degrees and programmes recognized in the text (label: phrases, matched case-insensitively).
  education_keywords:
    PhD: [phd, ph.d, doctorate, doctoral]
    Master's: [master, m.s., msc, m.sc, mba, m.eng]
    Bachelor's: [bachelor, bs, b.s., bsc, b.sc, b.a., b.eng]
    Bootcamp or certificate: [bootcamp, boot camp, certificate, certification]
  max_title_chars: 60         # a "title" is a short line containing one of the keywords
  max_titles: 5
  max_years: 50               # a larger "N years" figure is ignored as not a career length

# Experience-level filter on Resume match (a filter and a default, never part of the score).
levels:
  groups:
    "Intern and junior": [intern, junior]
    "Mid-level": [mid, unspecified]
    "Senior": [senior]
    "Staff and principal": [staff, principal]
    "Manager and above": [manager, director, executive]
  entry_group: "Intern and junior"
  mid_group: "Mid-level"
  senior_groups: ["Senior", "Staff and principal"]
  entry_max_years: 2          # up to this many years of experience (or an intern title) => entry levels
  senior_min_years: 6         # this many years or more => senior and staff levels

match:
  min_resume_skills: 3        # fewer recognized skills than this: ask for more instead of ranking
  top_learn_n: 20             # "Top skills to learn" looks at the best N matches
  top_learn_max: 8            # and lists at most this many skills
  min_posting_skills: 5       # postings with fewer extracted skills are not ranked (score would be noise)
  min_matched: 1
  max_results: 50
