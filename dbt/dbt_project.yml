name: jobpulse
version: "0.1.0"
config-version: 2
profile: jobpulse

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target"]

flags:
  send_anonymous_usage_stats: false
  use_colors: false

# Defaults only; `jobpulse build-silver` passes the real values from config/pipeline.yaml.
vars:
  bronze_schema: bronze
  silver_schema: silver
  gold_schema: gold
  gold_stage_schema: gold_stage
  extract_schema: extract
  annualization: {year: 1, month: 12, week: 52, hour: 2080}
  min_salaries_for_percentiles: 5
  closure_consecutive_absences: 2
  extraction_exclude: ''
  extraction_families:
    - {name: data_engineer, pattern: 'data engineer', exclude: ''}

models:
  jobpulse:
    +schema: "{{ var('silver_schema') }}"
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
      +schema: "{{ var('gold_schema') }}"
      # int_ models and the Python-built mapping tables live in a separate stage schema so the
      # gold schema holds only what the app reads.
      int_latest_extraction:
        +schema: "{{ var('gold_stage_schema') }}"
snapshots:
  jobpulse:
    +schema: "{{ var('gold_schema') }}"
