version: 2

models:
  - name: int_latest_extraction
    description: Newest extraction per content_hash (stage schema, not read by the app).
    columns:
      - {name: content_hash, tests: [unique, not_null]}
  - name: fct_postings
    description: >
      One row per posting with extracted fields. Advertised salary only; annual figures only where
      the period is known (salary_period_inferred marks a rule-filled period).
    columns:
      - {name: posting_key, tests: [unique, not_null]}
      - {name: company_id, tests: [not_null]}
      - {name: source_id, tests: [not_null]}
      - {name: has_extraction, tests: [not_null]}
      - name: city
        description: Place label, one per (city, state/province, country), e.g. 'Dublin, Ireland' vs 'Dublin, California'. NULL when no single place can be parsed.
      - {name: has_advertised_salary, tests: [not_null]}
      - {name: salary_period_inferred, tests: [not_null]}
      - {name: first_seen_date, tests: [not_null]}
      - {name: is_active, tests: [not_null]}
      - {name: is_probable_duplicate, tests: [not_null]}
      - name: role_family
        tests:
          - accepted_values:
              arguments:
                values: [data_analyst, data_engineer, analytics_engineer, bi, business_analyst, data_scientist, ml_ai_engineer, other]
      - name: seniority
        tests:
          - accepted_values:
              arguments:
                values: [intern, junior, mid, senior, staff, principal, manager, director, executive, unspecified]
      - name: remote_policy
        tests:
          - accepted_values:
              arguments: {values: [remote, hybrid, onsite, unspecified]}
      - name: sponsorship_statement
        tests:
          - accepted_values:
              arguments: {values: [offered, not_offered, unspecified]}
      - name: salary_period
        tests:
          - accepted_values:
              arguments: {values: [hour, day, week, month, year]}
      - name: sponsorship_class
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [CONFIRMED_OFFERED, EXPLICITLY_UNAVAILABLE, HISTORICAL_EVIDENCE, UNKNOWN]}
      - name: is_active
        tests:
          - accepted_values:
              arguments: {values: [true, false], quote: false}
  - name: int_lca_certified
    description: Certified LCA cases of matched employers with role family and annualized wage (stage schema, not read by the app).
    columns:
      - {name: case_number, tests: [unique, not_null]}
  - name: int_company_lca
    description: Per-company LCA match and certified counts (stage schema, not read by the app).
    columns:
      - {name: company_id, tests: [unique, not_null]}
  - name: agg_lca_company_year
    description: >
      Public-filing evidence, not a promise of sponsorship. Cases per company and fiscal year by
      outcome; only plain CERTIFIED counts as evidence.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [company_id, fiscal_year]
    columns:
      - {name: company_id, tests: [not_null]}
      - {name: fiscal_year, tests: [not_null]}
      - {name: n_certified, tests: [not_null]}
  - name: agg_lca_company_role
    description: Certified LCAs per company, fiscal year and role family (from the LCA job title).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [company_id, fiscal_year, role_family]
    columns:
      - name: role_family
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [data_analyst, data_engineer, analytics_engineer, bi, business_analyst, data_scientist, ml_ai_engineer, other]
  - name: agg_lca_wage_level
    description: Certified LCAs per company, fiscal year and DOL prevailing-wage level.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [company_id, fiscal_year, wage_level]
    columns:
      - name: wage_level
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [I, II, III, IV, unknown]}
  - name: agg_lca_wage_by_soc_city
    description: >
      OFFERED wages on certified LCAs (not advertised salary; never blended with it), from matched
      employers only. Percentiles are NULL below the minimum count.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [role_family, worksite_state, worksite_city]
    columns:
      - {name: n_certified, tests: [not_null]}
      - {name: coverage_pct, tests: [not_null]}
  - name: dim_company
    description: One row per company.
    columns:
      - {name: company_id, tests: [unique, not_null]}
      - {name: name, tests: [not_null]}
      - {name: n_postings, tests: [not_null]}
      - name: visa_evidence_class
        description: Evidence from public filings, not a promise of sponsorship. Filing history only; posting statements are per posting (fct_postings.sponsorship_class). Show n_lca_certified beside it.
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [HISTORICAL_EVIDENCE, UNKNOWN]}
  - name: dim_skill
    description: One row per canonical skill name (jobpulse.skills.norm_skill).
    columns:
      - {name: skill_id, tests: [unique, not_null]}
      - {name: canonical_name, tests: [unique, not_null]}
  - name: bridge_posting_skill
    description: Normalized, deduplicated skills per posting.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [posting_key, skill_id]
    columns:
      - {name: posting_key, tests: [not_null]}
      - name: skill_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_skill')
                field: skill_id
  - name: agg_skill_demand_weekly
    description: Weekly skill demand per role family (extracted postings only).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [week_start, skill_id, role_family]
    columns:
      - {name: week_start, tests: [not_null]}
      - {name: skill_id, tests: [not_null]}
      - name: role_family
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [data_analyst, data_engineer, analytics_engineer, bi, business_analyst, data_scientist, ml_ai_engineer, other]
      - {name: active_postings, tests: [not_null]}
      - {name: new_postings, tests: [not_null]}
      - {name: share_of_postings, tests: [not_null]}
  - name: agg_salary_by_role_city
    description: >
      Advertised salary only (never LCA wages). One row per currency within a
      (role_family, seniority, city) group; coverage_pct is the group's share with any salary.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [role_family, seniority, city, salary_currency]
    columns:
      - name: role_family
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [data_analyst, data_engineer, analytics_engineer, bi, business_analyst, data_scientist, ml_ai_engineer, other]
      - name: seniority
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [intern, junior, mid, senior, staff, principal, manager, director, executive, unspecified]
      - {name: city, tests: [not_null]}
      - {name: salary_currency, tests: [not_null]}
      - {name: n_postings, tests: [not_null]}
      - {name: n_with_salary, tests: [not_null]}
      - {name: coverage_pct, tests: [not_null]}

snapshots:
  - name: snap_postings
    description: History of content_hash/source_status per posting (check strategy).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [posting_key, dbt_valid_from]
    columns:
      - {name: posting_key, tests: [not_null]}
      - {name: content_hash, tests: [not_null]}
      - name: source_status
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [active, closed]}
