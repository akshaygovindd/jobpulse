version: 2

sources:
  - name: bronze
    schema: "{{ var('bronze_schema') }}"
    tables:
      - name: raw_postings
        description: Raw postings from authoritative snapshots only (loaded by jobpulse load-bronze).
        tests:
          - unique_combination:
              arguments:
                combination_of_columns: [source_id, board_id, snapshot_date, external_posting_id]
        columns:
          - {name: source_id, tests: [not_null]}
          - {name: board_id, tests: [not_null]}
          - {name: snapshot_date, tests: [not_null]}
          - {name: attempt_id, tests: [not_null]}
          - {name: external_posting_id, tests: [not_null]}
          - {name: content_hash, tests: [not_null]}
      - name: posting_content
        description: >
          Description text and raw API payload, kept once per (posting, content_hash) rather than
          once per daily observation (loaded by jobpulse load-bronze).
        tests:
          - unique_combination:
              arguments:
                combination_of_columns: [source_id, external_posting_id, content_hash]
        columns:
          - {name: source_id, tests: [not_null]}
          - {name: external_posting_id, tests: [not_null]}
          - {name: content_hash, tests: [not_null]}
      - name: snapshot_pointers
        description: One row per authoritative logical snapshot, including empty boards.
        tests:
          - unique_combination:
              arguments:
                combination_of_columns: [source_id, board_id, snapshot_date]
        columns:
          - {name: source_id, tests: [not_null]}
          - {name: board_id, tests: [not_null]}
          - {name: snapshot_date, tests: [not_null]}
          - {name: attempt_id, tests: [not_null]}
  - name: extract
    schema: "{{ var('extract_schema') }}"
    description: LLM extraction cache written by `jobpulse extract`. Gold reads it; never writes it.
    tables:
      - name: extractions
      - name: llm_calls
  - name: gold_stage
    schema: "{{ var('gold_stage_schema') }}"
    description: Mapping tables written in Python by `jobpulse build-gold` before dbt runs.
    tables:
      - name: skill_map
      - name: location_map
  - name: ref
    schema: "{{ var('ref_schema') }}"
    description: US DOL OFLC H-1B LCA disclosures matched to our companies (jobpulse load-lca). Evidence from public filings, not a promise of sponsorship.
    tables:
      - name: lca_disclosures
      - name: employer_lca_match
  - name: ops
    schema: "{{ var('ops_schema') }}"
    description: Run records loaded from S3 by `jobpulse load-ops`. Gold reads them; never writes them.
    tables:
      - name: pipeline_runs
      - name: company_snapshots
