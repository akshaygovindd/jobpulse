version: 2

models:
  - name: fct_posting_observations
    description: Per authoritative snapshot date, whether each known posting was present.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [posting_key, snapshot_date]
    columns:
      - {name: posting_key, tests: [not_null]}
      - {name: snapshot_date, tests: [not_null]}
      - {name: attempt_id, tests: [not_null]}
      - {name: observed, tests: [not_null]}
  - name: dim_posting_versions
    description: One row per content version of a posting (new row only when content_hash changes).
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [posting_key, valid_from]
    columns:
      - {name: posting_key, tests: [not_null]}
      - {name: content_hash, tests: [not_null]}
      - {name: valid_from, tests: [not_null]}
  - name: int_posting_closure
    description: Postings closed by the consecutive-absence rule.
    columns:
      - {name: posting_key, tests: [unique, not_null]}
      - {name: closed_date, tests: [not_null]}
  - name: int_posting_duplicates
    description: Cross-source probable duplicates (flag only).
    columns:
      - {name: posting_key, tests: [unique, not_null]}
      - {name: probable_duplicate_of, tests: [not_null]}
  - name: dim_postings
    description: Silver postings, one row per posting_key.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source_id, external_posting_id]
          config:
            where: "source_status = 'active'"
    columns:
      - {name: posting_key, tests: [unique, not_null]}
      - {name: source_id, tests: [not_null]}
      - {name: external_posting_id, tests: [not_null]}
      - {name: company_id, tests: [not_null]}
      - name: source_status
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [active, closed]}
      - {name: first_seen_at, tests: [not_null]}
      - {name: last_seen_at, tests: [not_null]}
