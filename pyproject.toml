[project]
name = "jobpulse"
version = "0.1.0"
description = "Daily job market intelligence pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.35",
  "duckdb==1.5.6",  # pinned: MotherDuck supports DuckDB <= 1.5.6 only (v2.0 refused)
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.scripts]
jobpulse = "jobpulse.cli:main"

[dependency-groups]
dbt = [
    "dbt-duckdb>=1.11.1",
]
dev = [
  "moto[s3]>=5.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobpulse"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits real public APIs; run with `pytest -m live`"]

[tool.uv]
# dbt is a default group so CI and `make check` can run the silver fixture tests.
# Production jobs choose groups explicitly (--no-default-groups [--group dbt]).
default-groups = ["dev", "dbt"]
