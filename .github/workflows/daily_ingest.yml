name: Daily ingest

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (off the top of the hour to reduce cron drops)
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Must equal today's UTC date (YYYY-MM-DD). Leave blank for today. Missed days stay gaps."
        required: false
        default: ""

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: prod # OIDC sub = repo:akshaygovindd/jobpulse:environment:prod; prod is main-only
    timeout-minutes: 45
    env:
      JOBPULSE_BUCKET: ${{ vars.JOBPULSE_BUCKET }}
    steps:
      - name: Validate snapshot_date (must be today, UTC)
        env:
          INPUT_SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          today="$(date -u +%F)"
          requested="${INPUT_SNAPSHOT_DATE:-$today}"
          if ! [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::snapshot_date '$requested' is not YYYY-MM-DD"; exit 1
          fi
          if [[ "$requested" != "$today" ]]; then
            echo "::error::snapshot_date $requested != current UTC date $today. Live runs only record today; missed days stay gaps."
            exit 1
          fi
          echo "SNAPSHOT_DATE=$requested" >> "$GITHUB_ENV"

      - name: Check required environment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::prod environment variable AWS_ROLE_ARN is not set"; exit 1; }
          [[ -n "$JOBPULSE_BUCKET" ]] || { echo "::error::prod environment variable JOBPULSE_BUCKET is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      # TEMPORARY (OIDC debugging): print only the decoded sub/aud/iss claims of the token AWS
      # will receive. The raw token is masked and never printed. Remove once the trust policy is fixed.
      - name: "DEBUG: show OIDC token claims (sub, aud, iss only)"
        run: |
          set +x
          resp="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          printf '%s' "$token" | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "iss"):
              print(f"{k}: {claims.get(k)}")
          '

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: jobpulse-ingest-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Ingest (Greenhouse, Lever)
        run: uv run jobpulse ingest --snapshot-date "$SNAPSHOT_DATE"

      - name: Freshness check
        if: ${{ !cancelled() }}
        run: uv run jobpulse check-freshness
