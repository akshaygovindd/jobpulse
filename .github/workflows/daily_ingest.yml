name: Daily ingest

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (off the top of the hour to reduce cron drops)
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Must equal today's UTC date (YYYY-MM-DD). Leave blank for today. Missed days stay gaps."
        required: false
        default: ""

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: prod # OIDC sub = repo:akshaygovindd@97725846/jobpulse@1451951419:environment:prod; prod is main-only
    timeout-minutes: 45
    env:
      JOBPULSE_BUCKET: ${{ vars.JOBPULSE_BUCKET }}
      UV_NO_SYNC: "1" # the explicit `uv sync` step below picks the dependency groups; `uv run` must not re-sync
    steps:
      - name: Validate snapshot_date (must be today, UTC)
        env:
          INPUT_SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          today="$(date -u +%F)"
          requested="${INPUT_SNAPSHOT_DATE:-$today}"
          if ! [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::snapshot_date '$requested' is not YYYY-MM-DD"; exit 1
          fi
          if [[ "$requested" != "$today" ]]; then
            echo "::error::snapshot_date $requested != current UTC date $today. Live runs only record today; missed days stay gaps."
            exit 1
          fi
          echo "SNAPSHOT_DATE=$requested" >> "$GITHUB_ENV"

      - name: Check required environment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::prod environment variable AWS_ROLE_ARN is not set"; exit 1; }
          [[ -n "$JOBPULSE_BUCKET" ]] || { echo "::error::prod environment variable JOBPULSE_BUCKET is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-default-groups

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: jobpulse-ingest-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Ingest (Greenhouse, Lever, Ashby)
        run: uv run jobpulse ingest --snapshot-date "$SNAPSHOT_DATE"

      - name: Freshness check
        if: ${{ !cancelled() }}
        run: uv run jobpulse check-freshness

  # Bronze/silver run as a separate job so a MotherDuck problem can never fail or block ingest.
  # S3 is the source of truth: if this job fails, the next run catches up from the pointers.
  warehouse:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      JOBPULSE_BUCKET: ${{ vars.JOBPULSE_BUCKET }}
      UV_NO_SYNC: "1" # the explicit `uv sync` step below picks the dependency groups; `uv run` must not re-sync
    steps:
      - name: Check required configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::prod environment variable AWS_ROLE_ARN is not set"; exit 1; }
          [[ -n "$JOBPULSE_BUCKET" ]] || { echo "::error::prod environment variable JOBPULSE_BUCKET is not set"; exit 1; }
          [[ -n "$MOTHERDUCK_TOKEN" ]] || { echo "::error::prod environment secret MOTHERDUCK_TOKEN is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-default-groups --group dbt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: jobpulse-warehouse-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Load ops JSON into MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: uv run jobpulse load-ops

      - name: Load bronze (authoritative pointers only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: uv run jobpulse load-bronze

      - name: Build silver (dbt models + tests)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: uv run jobpulse build-silver

  # LLM extraction runs last and only when the warehouse job succeeded (it reads silver). A failure
  # here can never affect ingest or the warehouse. Postings are extracted once (content-hash cache);
  # a daily run only pays for new or changed postings in the target role families. The spend cap
  # comes from config/extraction.yaml (budget.run_cap_usd = $0.25); postings over the cap are queued.
  extract:
    needs: warehouse
    if: ${{ !cancelled() && needs.warehouse.result == 'success' }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1" # the explicit `uv sync` step below picks the dependency groups; `uv run` must not re-sync
    steps:
      - name: Check required configuration
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          [[ -n "$MOTHERDUCK_TOKEN" ]] || { echo "::error::prod environment secret MOTHERDUCK_TOKEN is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-default-groups

      # OPENAI_API_KEY is set on this step only (the CLI fails with a clear error if it is empty).
      # No AWS credentials are needed or configured.
      - name: Extract (cheap model first, escalate on invalid, cap $0.25)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run jobpulse extract --cap 0.25
